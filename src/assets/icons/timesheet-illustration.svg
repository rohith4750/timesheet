<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Elements -->
  <rect width="800" height="600" fill="#F8FAFC"/>
  
  <!-- Calendar Grid -->
  <rect x="150" y="100" width="500" height="400" rx="20" fill="white" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Calendar Header -->
  <rect x="150" y="100" width="500" height="60" rx="20" fill="#3B82F6"/>
  
  <!-- Time Blocks -->
  <rect x="200" y="200" width="100" height="60" rx="8" fill="#93C5FD" opacity="0.8"/>
  <rect x="350" y="200" width="150" height="60" rx="8" fill="#60A5FA" opacity="0.9"/>
  <rect x="200" y="300" width="200" height="60" rx="8" fill="#2563EB" opacity="0.7"/>
  <rect x="450" y="300" width="100" height="60" rx="8" fill="#1D4ED8" opacity="0.8"/>
  
  <!-- Decorative Elements -->
  <circle cx="650" cy="150" r="30" fill="#BFDBFE" opacity="0.5"/>
  <circle cx="180" cy="450" r="20" fill="#93C5FD" opacity="0.3"/>
  
  <!-- Time Indicators -->
  <line x1="170" y1="200" x2="170" y2="450" stroke="#CBD5E1" stroke-width="2"/>
  <text x="175" y="180" font-family="Arial" font-size="12" fill="#64748B">9:00</text>
  <text x="175" y="280" font-family="Arial" font-size="12" fill="#64748B">13:00</text>
  <text x="175" y="380" font-family="Arial" font-size="12" fill="#64748B">17:00</text>
  
  <!-- Project Labels -->
  <text x="210" y="235" font-family="Arial" font-size="14" fill="white">Project A</text>
  <text x="360" y="235" font-family="Arial" font-size="14" fill="white">Meeting</text>
  <text x="210" y="335" font-family="Arial" font-size="14" fill="white">Development</text>
  <text x="460" y="335" font-family="Arial" font-size="14" fill="white">Review</text>
</svg>